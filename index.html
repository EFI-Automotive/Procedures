<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Machine procedures</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Favicon: put a file named favicon.ico or favicon.png in the root of the public branch -->
  <link rel="icon" href="favicon.ico">

  <style>
    :root {
      --bg: #0f172a;
      --bg-card: #111827;
      --bg-card-hover: #1f2937;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.2);
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --border: #1f2937;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0b1220, #020617);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .app { width: 100%; max-width: 1150px; }

    header { margin-bottom: 24px; }

    .top-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .title {
      font-size: 26px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .title span.icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 18px;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .toolbar {
      margin-top: 18px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-box {
      position: relative;
      flex: 1 1 240px;
      max-width: 360px;
    }

    .search-box input {
      width: 100%;
      padding: 9px 32px 9px 30px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      outline: none;
      font-size: 14px;
    }

    .search-box input::placeholder { color: #6b7280; }

    .search-box span.icon {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: #6b7280;
    }

    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .button {
      border-radius: 999px;
      border: 1px solid var(--accent-soft);
      background: rgba(15, 23, 42, 0.9);
      color: var(--accent);
      font-size: 13px;
      padding: 7px 14px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      outline: none;
      text-decoration: none;
      white-space: nowrap;
    }

    .button:hover {
      background: var(--accent-soft);
    }

    .grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 12px 12px 10px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: transform 0.12s ease-out,
                  box-shadow 0.12s ease-out,
                  border-color 0.12s ease-out,
                  background 0.12s ease-out;
    }

    .card:hover {
      transform: translateY(-2px);
      background: var(--bg-card-hover);
      border-color: var(--accent-soft);
      box-shadow: 0 12px 25px rgba(15, 23, 42, 0.8);
    }

    .card-main {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .file-icon {
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: radial-gradient(circle at top left, var(--accent), #1d4ed8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      color: #e5f2ff;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.25;
    }

    .card-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-top: 4px;
    }

    .pill {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid #1f2937;
      font-size: 11px;
    }

    .card-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }

    .btn-sm {
      border-radius: 999px;
      border: 1px solid #1f2937;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text-muted);
      font-size: 11px;
      padding: 4px 9px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .btn-sm:hover {
      border-color: var(--accent-soft);
      color: var(--accent);
    }

    .empty {
      margin-top: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #111827;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      border: 1px solid var(--accent-soft);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: opacity 0.15s ease-out, transform 0.15s ease-out;
      z-index: 50;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    @media (max-width: 600px) {
      body { padding: 14px; }
      .title { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="top-row">
        <div>
          <div class="title">
            <span class="icon">📘</span>
            <span>Machine procedures</span>
          </div>
          <div class="subtitle">
            Open the PDF for each machine, copy its link, and generate a QR code in one click.
          </div>
        </div>
        <div>
          <button id="uploadButton" class="button" type="button">
            <span>⬆️</span>
            <span>Upload document</span>
          </button>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <span class="icon">🔍</span>
          <input id="search" type="text" placeholder="Search a procedure (machine name, type…)" />
        </div>
        <div class="badge" id="counter">0 documents</div>
      </div>
    </header>

    <main>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" style="display:none;">
        No document found. Try another search term or check that there are PDF files in the <code>public</code> branch.
      </div>
    </main>
  </div>

  <div id="toast" class="toast">Link copied to clipboard</div>

  <script>
    // 🔧 CONFIGURATION — adapt if needed
    const user   = "EFI-Automotive";
    const repo   = "Procedures";
    const branch = "public";

    const apiUrl      = `https://api.github.com/repos/${user}/${repo}/contents/?ref=${branch}`;
    const baseUrl     = `https://${user}.github.io/${repo}/`;
    const uploadUrl   = `https://github.com/${user}/${repo}/upload/${branch}`;
    const qrSiteUrl   = "https://www.qr-code-generator.com/";
    const toastEl     = document.getElementById("toast");
    const grid        = document.getElementById("grid");
    const empty       = document.getElementById("empty");
    const searchInput = document.getElementById("search");
    const counter     = document.getElementById("counter");
    const uploadBtn   = document.getElementById("uploadButton");

    let allFiles = [];

    uploadBtn.addEventListener("click", () => {
      window.open(uploadUrl, "_blank");
    });

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    function formatName(filename) {
      return filename
        .replace(/\.pdf$/i, "")
        .replace(/[_\-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function formatSize(bytes) {
      if (!bytes && bytes !== 0) return "";
      const kb = bytes / 1024;
      if (kb < 1024) return kb.toFixed(1) + " KB";
      const mb = kb / 1024;
      return mb.toFixed(2) + " MB";
    }

    function guessTag(name) {
      const n = name.toLowerCase();
      if (n.includes("safety")) return "Safety";
      if (n.includes("maintenance")) return "Maintenance";
      if (n.includes("clean")) return "Cleaning";
      if (n.includes("start") || n.includes("setup")) return "Start-up";
      return "Procedure";
    }

    function gitHubDeleteUrl(fileName) {
      // This opens the GitHub UI “delete this file” page
      return `https://github.com/${user}/${repo}/delete/${branch}/${encodeURIComponent(fileName)}`;
    }

    function render(files) {
      grid.innerHTML = "";
      if (!files.length) {
        empty.style.display = "block";
        counter.textContent = "0 documents";
        return;
      }
      empty.style.display = "none";
      counter.textContent = files.length + (files.length > 1 ? " documents" : " document");

      files.forEach(file => {
        const cleanName = formatName(file.name);
        const tag = guessTag(cleanName);
        const sizeText = formatSize(file.size);
        const fileUrl = baseUrl + encodeURIComponent(file.name);
        const deleteUrl = gitHubDeleteUrl(file.name);

        const card = document.createElement("div");
        card.className = "card";

        const cardMain = document.createElement("div");
        cardMain.className = "card-main";
        cardMain.addEventListener("click", () => {
          window.open(fileUrl, "_blank");
        });

        cardMain.innerHTML = `
          <div class="file-icon">PDF</div>
          <div>
            <div class="card-title">${cleanName}</div>
            <div class="card-meta">
              <span>${sizeText || ""}</span>
              <span class="pill">${tag}</span>
            </div>
          </div>
        `;

        const actions = document.createElement("div");
        actions.className = "card-actions";

        // Open button (optional, the card click does it too)
        const openBtn = document.createElement("button");
        openBtn.type = "button";
        openBtn.className = "btn-sm";
        openBtn.innerHTML = "🔓 Open";
        openBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          window.open(fileUrl, "_blank");
        });

        const copyBtn = document.createElement("button");
        copyBtn.type = "button";
        copyBtn.className = "btn-sm";
        copyBtn.innerHTML = "📋 Copy link";
        copyBtn.addEventListener("click", async (e) => {
          e.stopPropagation();
          try {
            await navigator.clipboard.writeText(fileUrl);
            showToast("Link copied to clipboard");
          } catch {
            showToast("Unable to copy link");
          }
        });

        const qrBtn = document.createElement("button");
        qrBtn.type = "button";
        qrBtn.className = "btn-sm";
        qrBtn.innerHTML = "🔗 QR code";
        qrBtn.addEventListener("click", async (e) => {
          e.stopPropagation();
          try {
            await navigator.clipboard.writeText(fileUrl);
            showToast("Link copied – paste it into the QR generator");
          } catch {
            showToast("Link ready – open QR generator");
          }
          window.open(qrSiteUrl, "_blank");
        });

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "btn-sm";
        delBtn.innerHTML = "🗑 Delete on GitHub";
        delBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          window.open(deleteUrl, "_blank");
        });

        actions.appendChild(openBtn);
        actions.appendChild(copyBtn);
        actions.appendChild(qrBtn);
        actions.appendChild(delBtn);

        card.appendChild(cardMain);
        card.appendChild(actions);
        grid.appendChild(card);
      });
    }

    async function loadFiles() {
      try {
        const res = await fetch(apiUrl);
        const data = await res.json();
        allFiles = (Array.isArray(data) ? data : [])
          .filter(f => f.type === "file" && f.name.toLowerCase().endsWith(".pdf"));
        render(allFiles);
      } catch (e) {
        console.error("Error loading files", e);
        empty.style.display = "block";
        empty.textContent = "Error while loading documents.";
      }
    }

    searchInput.addEventListener("input", () => {
      const q = searchInput.value.toLowerCase().trim();
      if (!q) {
        render(allFiles);
        return;
      }
      const filtered = allFiles.filter(f =>
        f.name.toLowerCase().includes(q) ||
        formatName(f.name).toLowerCase().includes(q)
      );
      render(filtered);
    });

    loadFiles();
  </script>
</body>
</html>
